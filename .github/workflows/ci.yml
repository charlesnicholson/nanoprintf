name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * 0'  # Weekly
  workflow_dispatch:
    inputs:
      size_only:
        description: 'Skip everything but size-reports (for README-only commits)'
        type: boolean
        default: false

# Supersede a pull request's earlier runs when it is pushed to again. head_ref is
# only set for pull_request events, so tag pushes, the weekly cron, and manual
# dispatches fall through to run_id, get a group to themselves, and are never
# cancelled -- a tag push has to reach the release job.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  packages: read

jobs:
  lint:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Ruff
        run: ./bin/ruff check build.py tests/gen_tests.py tests/gen_eg_tests.py tests/size_report.py tests/avr_int16.py

  sanitizers:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        sanitizer: [ubsan, asan]
        architecture: [32, 64]
        shard: ['1/4', '2/4', '3/4', '4/4']

    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: make -j$(nproc) ARCH=${{ matrix.architecture }} SAN=${{ matrix.sanitizer }} SHARD=${{ matrix.shard }} VERBOSE=1

  linux-x64:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        compiler: [gcc, clang]
        configuration: [Debug, Release]
        architecture: [32, 64]
        shard: ['1/4', '2/4', '3/4', '4/4']
        include:
        - compiler: gcc
          cc: gcc
          cxx: g++
        - compiler: clang
          cc: clang
          cxx: clang++
        exclude:
        - compiler: gcc
          architecture: 32

    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -j$(nproc) CFG=${{ matrix.configuration }} ARCH=${{ matrix.architecture }} SHARD=${{ matrix.shard }} VERBOSE=1

  linux-arm64:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-24.04-arm

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        compiler: [gcc, clang]
        configuration: [Debug, Release]
        shard: ['1/4', '2/4', '3/4', '4/4']
        include:
        - compiler: gcc
          cc: gcc
          cxx: g++
        - compiler: clang
          cc: clang
          cxx: clang++

    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -j$(nproc) CFG=${{ matrix.configuration }} ARCH=64 SHARD=${{ matrix.shard }} VERBOSE=1

  macos:
    if: github.event.inputs.size_only != 'true'
    runs-on: macos-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        shard: ['1/4', '2/4', '3/4', '4/4']

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make -j$(sysctl -n hw.ncpu) CFG=${{ matrix.configuration }} SHARD=${{ matrix.shard }} VERBOSE=1

  win:
    if: github.event.inputs.size_only != 'true'
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        architecture: [32, 64]

    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars${{ matrix.architecture }}.bat"
          call build.bat --cfg ${{ matrix.configuration }} -v --arch ${{ matrix.architecture }}

  size-reports:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: AVR2
        shell: bash
        run: ./bin/python3 tests/size_report.py -p avr2

      - name: AVR5
        shell: bash
        run: ./bin/python3 tests/size_report.py -p avr5

      - name: Cortex-M0
        shell: bash
        run: ./bin/python3 tests/size_report.py -p cm0

      - name: Cortex-M4
        shell: bash
        run: ./bin/python3 tests/size_report.py -p cm4

      - name: Linux x64
        shell: bash
        run: ./bin/python3 tests/size_report.py -p host

      - name: README size table generates
        shell: bash
        run: ./bin/python3 tests/size_report.py --update-readme

  avr-int16:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: qemu-system-avr
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends qemu-system-misc

      - name: 16-bit int conformance
        shell: bash
        run: ./bin/python3 tests/avr_int16.py

  all-checks-pass:
    needs: [lint, sanitizers, linux-x64, linux-arm64, macos, win, size-reports, avr-int16]
    # A size_only dispatch skips most of the jobs above, and a skipped dependency
    # would skip this job too, leaving the required check with nothing to report.
    if: always()
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: echo "A required job did not pass." && exit 1
    - run: echo Done

  release:
    needs: [all-checks-pass]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Find the previous version tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^${TAG}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "nanoprintf ${TAG}:" > release_notes.txt
          else
            {
              echo "nanoprintf ${TAG}:"
              echo ""

              # Extract unique PR numbers from commit messages between tags
              git log "${PREV_TAG}..${TAG}" --oneline \
                | grep -oE '\(#[0-9]+\)' | grep -oE '[0-9]+' | sort -un \
                | while read -r PR; do
                    TITLE=$(gh pr view "$PR" --json title --jq '.title' 2>/dev/null || true)
                    if [ -n "$TITLE" ]; then
                      echo "${TITLE} https://github.com/${GITHUB_REPOSITORY}/pull/${PR}"
                    fi
                  done
            } > release_notes.txt
          fi

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release_notes.txt
