name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * 0'  # Weekly
  workflow_dispatch:
    inputs:
      size_only:
        description: 'Skip everything but size-reports (for README-only commits)'
        type: boolean
        default: false

# Supersede a pull request's earlier runs when it is pushed to again. head_ref is
# only set for pull_request events, so tag pushes, the weekly cron, and manual
# dispatches fall through to run_id, get a group to themselves, and are never
# cancelled -- a tag push has to reach the release job.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  packages: read

jobs:
  lint:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Ruff
        run: ./bin/ruff check build.py release.py tests/gen_tests.py tests/gen_eg_tests.py tests/size_report.py tests/avr_int16.py

      # The checked-in header must stay unversioned; the release stamps it.
      - name: Version placeholder intact
        run: ./bin/python3 release.py --check

  sanitizers:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        sanitizer: [ubsan, asan]
        architecture: [32, 64]
        shard: ['1/4', '2/4', '3/4', '4/4']

    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: make -j$(nproc) ARCH=${{ matrix.architecture }} SAN=${{ matrix.sanitizer }} SHARD=${{ matrix.shard }} VERBOSE=1

  linux-x64:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        compiler: [gcc, clang]
        configuration: [Debug, Release]
        architecture: [32, 64]
        shard: ['1/4', '2/4', '3/4', '4/4']
        include:
        - compiler: gcc
          cc: gcc
          cxx: g++
        - compiler: clang
          cc: clang
          cxx: clang++
        exclude:
        - compiler: gcc
          architecture: 32

    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -j$(nproc) CFG=${{ matrix.configuration }} ARCH=${{ matrix.architecture }} SHARD=${{ matrix.shard }} VERBOSE=1

  linux-arm64:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-24.04-arm

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        compiler: [gcc, clang]
        configuration: [Debug, Release]
        shard: ['1/4', '2/4', '3/4', '4/4']
        include:
        - compiler: gcc
          cc: gcc
          cxx: g++
        - compiler: clang
          cc: clang
          cxx: clang++

    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -j$(nproc) CFG=${{ matrix.configuration }} ARCH=64 SHARD=${{ matrix.shard }} VERBOSE=1

  macos:
    if: github.event.inputs.size_only != 'true'
    runs-on: macos-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        shard: ['1/4', '2/4', '3/4', '4/4']

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make -j$(sysctl -n hw.ncpu) CFG=${{ matrix.configuration }} SHARD=${{ matrix.shard }} VERBOSE=1

  win:
    if: github.event.inputs.size_only != 'true'
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        architecture: [32, 64]

    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars${{ matrix.architecture }}.bat"
          call build.bat --cfg ${{ matrix.configuration }} -v --arch ${{ matrix.architecture }}

  size-reports:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: AVR2
        shell: bash
        run: ./bin/python3 tests/size_report.py -p avr2

      - name: AVR5
        shell: bash
        run: ./bin/python3 tests/size_report.py -p avr5

      - name: Cortex-M0
        shell: bash
        run: ./bin/python3 tests/size_report.py -p cm0

      - name: Cortex-M4
        shell: bash
        run: ./bin/python3 tests/size_report.py -p cm4

      - name: Linux x64
        shell: bash
        run: ./bin/python3 tests/size_report.py -p host

      - name: README size table generates
        shell: bash
        run: ./bin/python3 tests/size_report.py --update-readme

  avr-int16:
    if: github.event.inputs.size_only != 'true'
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: qemu-system-avr
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends qemu-system-misc

      - name: 16-bit int conformance
        shell: bash
        run: ./bin/python3 tests/avr_int16.py

  all-checks-pass:
    needs: [lint, sanitizers, linux-x64, linux-arm64, macos, win, size-reports, avr-int16]
    # A size_only dispatch skips most of the jobs above, and a skipped dependency
    # would skip this job too, leaving the required check with nothing to report.
    if: always()
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: echo "A required job did not pass." && exit 1
    - run: echo Done

  release:
    needs: [all-checks-pass]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read  # release.py reads the titles of the pull requests it links
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Stamps the tag into the header, bundles the source around that stamped header,
      # and composes the notes. Run it locally to see exactly what a tag would ship.
      - name: Prepare the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/python3 release.py --tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --out build/release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file build/release/release_notes.txt \
            "build/release/nanoprintf-${GITHUB_REF_NAME}.zip" \
            build/release/nanoprintf.h
