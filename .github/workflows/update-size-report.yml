name: Update size report

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 0'  # Weekly, an hour after the CI cron
  workflow_dispatch:

# Merges can land faster than a size report takes to build, and each run force-pushes
# the same branch. Let the newest merge cancel the older run so the table that wins is
# the one measured against the newest main.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  packages: read
  contents: write
  pull-requests: write
  actions: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Regenerate README size table
        shell: bash
        run: |
          git config --global --add safe.directory "$(pwd)"
          ./bin/python3 tests/size_report.py --update-readme

      - name: Open a pull request if changed
        id: size-report-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          base: main
          branch: bot/size-report
          add-paths: README.md
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          commit-message: Update README size table
          title: Update README size table
          body: Regenerated by `tests/size_report.py --update-readme`.

      # CI queued by a pull request that GITHUB_TOKEN opened waits at action_required
      # until a human approves it. Dispatch it directly instead, so all-checks-pass
      # reports without anyone having to click. The image has no gh CLI.
      - name: Dispatch CI to produce the required check
        if: steps.size-report-pr.outputs.pull-request-operation == 'created' || steps.size-report-pr.outputs.pull-request-operation == 'updated'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.size-report-pr.outputs.pull-request-branch }}
        run: |
          curl -fsS -X POST \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"${REF}\",\"inputs\":{\"size_only\":true}}"
