name: Update size report

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly, an hour after the CI cron
  workflow_dispatch:

permissions:
  packages: read
  contents: write
  pull-requests: write
  actions: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Regenerate README size table
        shell: bash
        run: python tests/size_report.py --update-readme

      - name: Open a pull request if changed
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bot/size-report
        run: |
          git config --global --add safe.directory "$(pwd)"
          if git diff --quiet -- README.md; then
            echo "README size table already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Update README size table" -- README.md
          git push --force origin "$BRANCH"

          # The container image has no gh CLI, so talk to the REST API directly.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json")

          status=$(curl -sS -o /tmp/pr.json -w '%{http_code}' -X POST "${api}/pulls" "${auth[@]}" \
            -d "{\"title\":\"Update README size table\",
                 \"head\":\"${BRANCH}\",
                 \"base\":\"main\",
                 \"body\":\"Regenerated by \`tests/size_report.py --update-readme\`.\"}")
          case "${status}" in
            201) echo "Opened pull request." ;;
            422) echo "A pull request is already open; the force-push updated it." ;;
            *) echo "Unexpected status ${status}:"; cat /tmp/pr.json; exit 1 ;;
          esac

          # CI queued by a pull request that GITHUB_TOKEN opened sits at
          # action_required and never runs, so dispatch it by hand to produce the
          # required all-checks-pass status.
          curl -fsS -X POST "${api}/actions/workflows/ci.yml/dispatches" "${auth[@]}" \
            -d "{\"ref\":\"${BRANCH}\"}"
